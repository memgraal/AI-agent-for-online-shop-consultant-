services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      LOG_FILE: ""
      JEV_LLM_API_KEY: ${JEV_LLM_API_KEY:?Set JEV_LLM_API_KEY in .env}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sss_faq}
      POSTGRES_USER: ${POSTGRES_USER:-sss_faq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - faq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  faq-workbench:
    build:
      context: .
      dockerfile: faq_workbench/Dockerfile
    env_file:
      - .env
    environment:
      FAQ_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-sss_faq}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-sss_faq}
      FAQ_ADMIN_API_KEY: ${FAQ_ADMIN_API_KEY:?Set FAQ_ADMIN_API_KEY in .env}
      FAQ_AI_SERVICE_URL: http://api:8000
      FAQ_AI_ADMIN_API_KEY: ${ADMIN_API_KEY:?Set ADMIN_API_KEY in .env}
    ports:
      - "127.0.0.1:${FAQ_API_PORT:-8010}:8010"
    volumes:
      - fastembed-cache:/home/app/.cache/fastembed
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - from urllib.request import urlopen; urlopen('http://127.0.0.1:8010/health', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  faq-postgres-data:
  fastembed-cache:
