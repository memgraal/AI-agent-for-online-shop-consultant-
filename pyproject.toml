[project]
name = "sss-ai-assistant"
version = "0.1.0"
description = "AI assistant service for the SSS security equipment store"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "websockets>=15,<17",
    "langgraph>=0.2,<2.0",
    "langchain-openai>=0.2,<2.0",
    "tiktoken>=0.7,<1.0",
    "pydantic-settings>=2.5,<3.0",
    "typesafe-sdk>=0.7.5,<1.0",
    "python-multipart>=0.0.9,<1.0",
    "pypdf>=5.0,<7.0",
    "python-docx>=1.1,<2.0",
    "SQLAlchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.29,<1.0",
    # Security floor for transitive TLS and image parsing dependencies.
    "certifi>=2026.10.19",
    "Pillow>=13.0.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1.0",
    "pytest>=9.0.3,<10.0",
    "pytest-asyncio>=0.23,<2.0",
]
lint = ["ruff>=0.11,<1.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F63", "F7", "F82"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
